<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="normvia-logo.svg" />
    <title>Normvia</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000000;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      #cosmos {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 0;
      }

      .vignette {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse at 50% 45%,
            rgba(0, 0, 0, 0) 0%,
            rgba(0, 0, 0, 0.28) 58%,
            rgba(0, 0, 0, 0.78) 100%
          );
      }

      .center {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 2;
        pointer-events: none;
      }

      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        /* Fixed brand — no parallax / gravity motion */
        transform: none;
      }

      .brand img {
        width: min(36vw, 220px);
        height: auto;
        object-fit: contain;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: crisp-edges;
        filter: drop-shadow(0 0 16px rgba(160, 190, 255, 0.22));
      }

      .brand .tagline {
        margin: 0;
        color: rgba(255, 255, 255, 0.92);
        font-size: clamp(0.9rem, 2.2vw, 1.2rem);
        letter-spacing: 0.05rem;
        text-align: center;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
        max-width: 90vw;
      }

      .brand h1 {
        margin: 0;
        color: #ffffff;
        letter-spacing: 0.35rem;
        text-transform: uppercase;
        font-size: clamp(2rem, 7vw, 4.5rem);
        text-shadow:
          0 0 10px rgba(255, 255, 255, 0.55),
          0 0 28px rgba(140, 170, 255, 0.28),
          0 0 48px rgba(90, 120, 220, 0.18);
      }
    </style>
  </head>
  <body>
    <canvas id="cosmos" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <main class="center" role="main" aria-label="Normvia landing page">
      <div class="brand">
        <img src="normvia-logo.svg" alt="Normvia logo" />
        <h1>Normvia</h1>
        <p class="tagline">The future isn't built by accident.</p>
      </div>
    </main>

    <script>
      (() => {
        const canvas = document.getElementById('cosmos');
        const ctx = canvas.getContext('2d');
        let width = 0;
        let height = 0;
        let dpr = 1;

        const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
        let reducedMotion = motionQuery.matches;

        // Mouse: normalized -1..1 for parallax, pixels for gravity
        const mouse = { x: 0, y: 0, tx: 0, ty: 0, px: 0, py: 0, tpx: 0, tpy: 0, active: false };
        const idle = { ax: 0, ay: 0 };

        const layers = [
          { depth: 0.15, count: 110, stars: [], sizeMin: 0.35, sizeMax: 0.95, pull: 0.0035 },
          { depth: 0.4, count: 80, stars: [], sizeMin: 0.55, sizeMax: 1.35, pull: 0.008 },
          { depth: 0.75, count: 50, stars: [], sizeMin: 0.85, sizeMax: 1.9, pull: 0.016 },
          { depth: 1.1, count: 22, stars: [], sizeMin: 1.2, sizeMax: 2.5, pull: 0.026 },
        ];

        const rings = [
          { rx: 0.28, ry: 0.18, depth: 0.55, alpha: 0.035, hue: 220, rot: 0, spin: 0.00008 },
          { rx: 0.42, ry: 0.26, depth: 0.85, alpha: 0.025, hue: 210, rot: 0.4, spin: -0.00005 },
          { rx: 0.58, ry: 0.34, depth: 1.15, alpha: 0.018, hue: 230, rot: 1.1, spin: 0.00003 },
        ];

        const planets = [
          { ox: -0.34, oy: 0.2, r: 36, depth: 0.7, hue: 215, alpha: 0.035 },
          { ox: 0.4, oy: -0.24, r: 24, depth: 1.0, hue: 225, alpha: 0.028 },
          { ox: 0.12, oy: 0.34, r: 16, depth: 1.25, hue: 205, alpha: 0.022 },
        ];

        const sparks = [];
        const shockwaves = [];
        let seeded = false;
        let start = performance.now();

        function seedStars() {
          for (const layer of layers) {
            layer.stars.length = 0;
            for (let i = 0; i < layer.count; i += 1) {
              const x = Math.random() * width;
              const y = Math.random() * height;
              layer.stars.push({
                hx: x,
                hy: y,
                x,
                y,
                vx: 0,
                vy: 0,
                r: layer.sizeMin + Math.random() * (layer.sizeMax - layer.sizeMin),
                a: Math.random() * 0.65 + 0.2,
                twinkle: Math.random() * 0.025 + 0.004,
                phase: Math.random() * Math.PI * 2,
              });
            }
          }
          seeded = true;
        }

        function resize() {
          width = window.innerWidth;
          height = window.innerHeight;
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.floor(width * dpr);
          canvas.height = Math.floor(height * dpr);
          canvas.style.width = width + 'px';
          canvas.style.height = height + 'px';
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          if (!seeded || layers[0].stars.length === 0) seedStars();
          if (!mouse.active) {
            mouse.tpx = width * 0.5;
            mouse.tpy = height * 0.5;
            mouse.px = mouse.tpx;
            mouse.py = mouse.tpy;
          }
        }

        function burst(x, y, magnitude = 1) {
          if (reducedMotion) return;
          const particles = Math.floor((8 + Math.random() * 10) * magnitude);
          // Cool white / soft blue only — no rainbow neon
          const hue = 205 + Math.random() * 30;
          for (let i = 0; i < particles; i += 1) {
            const speed = (Math.random() * 1.4 + 0.2) * magnitude;
            const angle = Math.random() * Math.PI * 2;
            sparks.push({
              x,
              y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              life: 0,
              maxLife: Math.random() * 45 + 28,
              size: Math.random() * 1.5 + 0.3,
              hue: (hue + Math.random() * 24 - 12 + 360) % 360,
            });
          }
        }

        function spawnShockwave(x, y) {
          if (reducedMotion) return;
          // Soft dual-ring pulse — calm, still readable
          shockwaves.push(
            { x, y, r: 0, maxR: Math.max(width, height) * 0.32, life: 0, maxLife: 70, width: 1.2, hue: 215, alpha: 0.22 },
            { x, y, r: 4, maxR: Math.max(width, height) * 0.18, life: 0, maxLife: 48, width: 0.8, hue: 225, alpha: 0.16 }
          );
          // Gentle outward nudge
          for (const layer of layers) {
            const impulse = 0.55 * layer.depth;
            for (const star of layer.stars) {
              const dx = star.x - x;
              const dy = star.y - y;
              const dist = Math.sqrt(dx * dx + dy * dy) || 1;
              if (dist < Math.max(width, height) * 0.45) {
                const falloff = 1 - dist / (Math.max(width, height) * 0.45);
                const force = impulse * falloff * falloff;
                star.vx += (dx / dist) * force;
                star.vy += (dy / dist) * force;
              }
            }
          }
          burst(x, y, 0.45);
        }

        function drawNebula(ox, oy) {
          const cx = width * 0.5 + ox * 0.25;
          const cy = height * 0.5 + oy * 0.25;
          // Pure deep space base
          ctx.fillStyle = '#000000';
          ctx.fillRect(0, 0, width, height);

          // Very soft central indigo veil — no neon mush
          const gradient = ctx.createRadialGradient(
            cx,
            cy,
            20,
            cx,
            cy,
            Math.max(width, height) * 0.78
          );
          gradient.addColorStop(0, 'rgba(8, 12, 28, 0.55)');
          gradient.addColorStop(0.4, 'rgba(3, 5, 14, 0.35)');
          gradient.addColorStop(0.75, 'rgba(0, 0, 0, 0.15)');
          gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, width, height);

          // Subtle cool-blue accent (desaturated)
          const g2 = ctx.createRadialGradient(
            cx - width * 0.22,
            cy + height * 0.12,
            0,
            cx - width * 0.22,
            cy + height * 0.12,
            Math.max(width, height) * 0.4
          );
          g2.addColorStop(0, 'rgba(70, 100, 180, 0.035)');
          g2.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = g2;
          ctx.fillRect(0, 0, width, height);

          // Soft indigo accent
          const g3 = ctx.createRadialGradient(
            cx + width * 0.2,
            cy - height * 0.14,
            0,
            cx + width * 0.2,
            cy - height * 0.14,
            Math.max(width, height) * 0.32
          );
          g3.addColorStop(0, 'rgba(55, 70, 140, 0.03)');
          g3.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = g3;
          ctx.fillRect(0, 0, width, height);
        }

        function drawRings(px, py, t) {
          const cx = width * 0.5;
          const cy = height * 0.5;
          for (const ring of rings) {
            const ox = px * ring.depth * 28;
            const oy = py * ring.depth * 22;
            const rot = reducedMotion ? ring.rot : ring.rot + t * ring.spin * 1000;
            ctx.save();
            ctx.translate(cx + ox, cy + oy);
            ctx.rotate(rot);
            ctx.scale(1, ring.ry / ring.rx);
            ctx.beginPath();
            ctx.strokeStyle = `hsla(${ring.hue}, 35%, 72%, ${ring.alpha})`;
            ctx.lineWidth = 0.9;
            ctx.ellipse(0, 0, Math.min(width, height) * ring.rx, Math.min(width, height) * ring.rx, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.strokeStyle = `hsla(${ring.hue}, 30%, 78%, ${ring.alpha * 0.45})`;
            ctx.lineWidth = 0.45;
            ctx.ellipse(0, 0, Math.min(width, height) * ring.rx * 0.97, Math.min(width, height) * ring.rx * 0.97, 0, 0.2, Math.PI * 0.9);
            ctx.stroke();
            ctx.restore();
          }
        }

        function drawPlanets(px, py) {
          const cx = width * 0.5;
          const cy = height * 0.5;
          for (const p of planets) {
            const x = cx + p.ox * Math.min(width, height) + px * p.depth * 36;
            const y = cy + p.oy * Math.min(width, height) + py * p.depth * 28;
            const g = ctx.createRadialGradient(x - p.r * 0.3, y - p.r * 0.3, 0, x, y, p.r);
            g.addColorStop(0, `hsla(${p.hue}, 28%, 62%, ${p.alpha * 1.2})`);
            g.addColorStop(0.55, `hsla(${p.hue}, 22%, 40%, ${p.alpha * 0.7})`);
            g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.beginPath();
            ctx.fillStyle = g;
            ctx.arc(x, y, p.r, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        function updateAndDrawStars(px, py, t) {
          const softRadius = Math.max(width, height) * 0.32;
          const softRadiusSq = softRadius * softRadius;

          for (const layer of layers) {
            const ox = px * layer.depth * 40;
            const oy = py * layer.depth * 32;

            for (const star of layer.stars) {
              if (!reducedMotion) {
                // Home spring (keeps field from collapsing)
                const hx = star.hx - star.x;
                const hy = star.hy - star.y;
                star.vx += hx * 0.012;
                star.vy += hy * 0.012;

                // Gravity toward mouse (stronger for nearer layers)
                if (mouse.active) {
                  const dx = mouse.px - (star.x + ox);
                  const dy = mouse.py - (star.y + oy);
                  const distSq = dx * dx + dy * dy;
                  if (distSq < softRadiusSq && distSq > 4) {
                    const dist = Math.sqrt(distSq);
                    // Soft gravity: strongest mid-range, fades near cursor to avoid clumping
                    const near = Math.min(1, dist / 60);
                    const falloff = (1 - dist / softRadius);
                    const force = layer.pull * falloff * falloff * near;
                    star.vx += (dx / dist) * force;
                    star.vy += (dy / dist) * force;
                  }
                }

                star.vx *= 0.94;
                star.vy *= 0.94;
                star.x += star.vx;
                star.y += star.vy;

                star.a += Math.sin(t * 0.001 + star.phase) * star.twinkle * 0.15;
                star.a += (Math.random() - 0.5) * star.twinkle * 0.3;
                star.a = Math.min(0.95, Math.max(0.12, star.a));
              }

              let sx = star.x + ox;
              let sy = star.y + oy;
              if (sx < -4) sx += width + 8;
              if (sx > width + 4) sx -= width + 8;
              if (sy < -4) sy += height + 8;
              if (sy > height + 4) sy -= height + 8;

              // Crisp white core
              ctx.beginPath();
              ctx.fillStyle = `rgba(245,248,255,${star.a})`;
              ctx.arc(sx, sy, star.r, 0, Math.PI * 2);
              ctx.fill();

              // Cool-blue halo on nearer / brighter stars only
              if (layer.depth > 0.65 && star.a > 0.5) {
                ctx.beginPath();
                ctx.fillStyle = `rgba(170,195,255,${star.a * 0.1})`;
                ctx.arc(sx, sy, star.r * 2.8, 0, Math.PI * 2);
                ctx.fill();
              }
            }
          }
        }

        function updateSparks() {
          for (let i = sparks.length - 1; i >= 0; i -= 1) {
            const p = sparks[i];
            p.life += 1;
            p.x += p.vx;
            p.y += p.vy;
            p.vx *= 0.988;
            p.vy *= 0.988;
            p.vy += 0.003;
            const t = p.life / p.maxLife;
            const alpha = Math.max(0, 1 - t);
            ctx.beginPath();
            ctx.fillStyle = `hsla(${p.hue}, 45%, 82%, ${alpha * 0.85})`;
            ctx.shadowBlur = 8 * alpha;
            ctx.shadowColor = `hsla(${p.hue}, 50%, 78%, ${alpha * 0.5})`;
            ctx.arc(p.x, p.y, p.size * (1 - t * 0.5), 0, Math.PI * 2);
            ctx.fill();
            if (p.life >= p.maxLife) sparks.splice(i, 1);
          }
          ctx.shadowBlur = 0;
        }

        function updateShockwaves() {
          for (let i = shockwaves.length - 1; i >= 0; i -= 1) {
            const w = shockwaves[i];
            w.life += 1;
            const t = w.life / w.maxLife;
            w.r = w.maxR * (1 - Math.pow(1 - t, 2.2));
            const alpha = w.alpha * Math.max(0, 1 - t);
            // Outer ring
            ctx.beginPath();
            ctx.strokeStyle = `hsla(${w.hue}, 40%, 78%, ${alpha})`;
            ctx.lineWidth = w.width * (1 - t * 0.5);
            ctx.shadowBlur = 6 * alpha;
            ctx.shadowColor = `hsla(${w.hue}, 45%, 75%, ${alpha * 0.45})`;
            ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2);
            ctx.stroke();
            // Soft fill bloom at epicenter early on
            if (t < 0.35) {
              const bloom = ctx.createRadialGradient(w.x, w.y, 0, w.x, w.y, w.r * 0.35 + 8);
              bloom.addColorStop(0, `hsla(${w.hue}, 35%, 80%, ${alpha * 0.18})`);
              bloom.addColorStop(1, 'rgba(0,0,0,0)');
              ctx.fillStyle = bloom;
              ctx.beginPath();
              ctx.arc(w.x, w.y, w.r * 0.35 + 8, 0, Math.PI * 2);
              ctx.fill();
            }
            if (w.life >= w.maxLife) shockwaves.splice(i, 1);
          }
          ctx.shadowBlur = 0;
        }

        function frame(now) {
          const t = now - start;

          if (!reducedMotion) {
            idle.ax = Math.sin(t * 0.00018) * 0.18;
            idle.ay = Math.cos(t * 0.00014) * 0.12;
          } else {
            idle.ax = 0;
            idle.ay = 0;
          }

          const lerp = reducedMotion ? 1 : 0.06;
          mouse.x += (mouse.tx - mouse.x) * lerp;
          mouse.y += (mouse.ty - mouse.y) * lerp;
          mouse.px += (mouse.tpx - mouse.px) * (reducedMotion ? 1 : 0.12);
          mouse.py += (mouse.tpy - mouse.py) * (reducedMotion ? 1 : 0.12);

          const px = mouse.x + idle.ax;
          const py = mouse.y + idle.ay;

          ctx.clearRect(0, 0, width, height);
          drawNebula(px, py);
          drawPlanets(px, py);
          drawRings(px, py, t);
          updateAndDrawStars(px, py, t);
          if (!reducedMotion) {
            updateSparks();
            updateShockwaves();
          }

          requestAnimationFrame(frame);
        }

        function onPointer(e) {
          if (reducedMotion) return;
          mouse.active = true;
          const x = (e.clientX / width) * 2 - 1;
          const y = (e.clientY / height) * 2 - 1;
          mouse.tx = Math.max(-1, Math.min(1, x));
          mouse.ty = Math.max(-1, Math.min(1, y));
          mouse.tpx = e.clientX;
          mouse.tpy = e.clientY;
        }

        function onPointerLeave() {
          mouse.active = false;
        }

        function onClick(e) {
          if (reducedMotion) return;
          const x = e.clientX;
          const y = e.clientY;
          // Prefer click point; if somehow invalid, fall back to center logo
          const cx = Number.isFinite(x) ? x : width * 0.5;
          const cy = Number.isFinite(y) ? y : height * 0.5;
          spawnShockwave(cx, cy);
        }

        function scheduleRandomBursts() {
          if (reducedMotion) return;
          const delay = 2800 + Math.random() * 4200;
          setTimeout(() => {
            if (!reducedMotion) {
              burst(
                Math.random() * width,
                Math.random() * height,
                0.25 + Math.random() * 0.35
              );
              scheduleRandomBursts();
            }
          }, delay);
        }

        function onMotionChange(e) {
          reducedMotion = e.matches;
          if (reducedMotion) {
            sparks.length = 0;
            shockwaves.length = 0;
            for (const layer of layers) {
              for (const star of layer.stars) {
                star.x = star.hx;
                star.y = star.hy;
                star.vx = 0;
                star.vy = 0;
              }
            }
          }
        }

        window.addEventListener('resize', resize);
        window.addEventListener('pointermove', onPointer, { passive: true });
        window.addEventListener('pointerleave', onPointerLeave, { passive: true });
        window.addEventListener('pointerdown', onClick, { passive: true });
        if (motionQuery.addEventListener) {
          motionQuery.addEventListener('change', onMotionChange);
        } else if (motionQuery.addListener) {
          motionQuery.addListener(onMotionChange);
        }

        resize();
        if (!reducedMotion) {
          for (let i = 0; i < 2; i += 1) {
            burst(
              Math.random() * width,
              Math.random() * height,
              0.3 + Math.random() * 0.25
            );
          }
          scheduleRandomBursts();
        }
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
