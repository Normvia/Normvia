<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="normvia-logo.svg" />
    <title>Normvia</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000000;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      #cosmos {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 0;
      }

      .vignette {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse at 50% 45%,
            rgba(0, 0, 0, 0) 0%,
            rgba(0, 0, 0, 0.22) 58%,
            rgba(0, 0, 0, 0.68) 100%
          );
      }

      .center {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 2;
        pointer-events: none;
      }

      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        /* Fixed brand — no parallax / gravity motion */
        transform: none;
      }

      .brand img {
        width: min(36vw, 220px);
        height: auto;
        object-fit: contain;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: crisp-edges;
        filter: drop-shadow(0 0 16px rgba(160, 190, 255, 0.28));
      }

      .brand .tagline {
        margin: 0;
        color: rgba(255, 255, 255, 0.92);
        font-size: clamp(0.9rem, 2.2vw, 1.2rem);
        letter-spacing: 0.05rem;
        text-align: center;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
        max-width: 90vw;
      }

      .brand h1 {
        margin: 0;
        color: #ffffff;
        letter-spacing: 0.35rem;
        text-transform: uppercase;
        font-size: clamp(2rem, 7vw, 4.5rem);
        text-shadow:
          0 0 10px rgba(255, 255, 255, 0.55),
          0 0 28px rgba(140, 170, 255, 0.32),
          0 0 48px rgba(90, 120, 220, 0.2);
      }
    </style>
  </head>
  <body>
    <canvas id="cosmos" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <main class="center" role="main" aria-label="Normvia landing page">
      <div class="brand">
        <img src="normvia-logo.svg" alt="Normvia logo" />
        <h1>Normvia</h1>
        <p class="tagline">The future isn't built by accident.</p>
      </div>
    </main>

    <script>
      (() => {
        const canvas = document.getElementById('cosmos');
        const ctx = canvas.getContext('2d');
        let width = 0;
        let height = 0;
        let dpr = 1;

        const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
        let reducedMotion = motionQuery.matches;

        // Mouse: normalized -1..1 for parallax, pixels for gravity
        const mouse = { x: 0, y: 0, tx: 0, ty: 0, px: 0, py: 0, tpx: 0, tpy: 0, active: false };
        const idle = { ax: 0, ay: 0 };

        // Midway pull between wild (~0.012–0.09) and calm (~0.0035–0.026)
        const layers = [
          { depth: 0.15, count: 100, stars: [], sizeMin: 0.35, sizeMax: 0.95, pull: 0.0075 },
          { depth: 0.4, count: 75, stars: [], sizeMin: 0.55, sizeMax: 1.35, pull: 0.018 },
          { depth: 0.75, count: 48, stars: [], sizeMin: 0.85, sizeMax: 1.9, pull: 0.035 },
          { depth: 1.1, count: 20, stars: [], sizeMin: 1.2, sizeMax: 2.5, pull: 0.058 },
        ];

        const planets = [
          { ox: -0.34, oy: 0.2, r: 34, depth: 0.7, hue: 215, alpha: 0.08 },
          { ox: 0.4, oy: -0.24, r: 22, depth: 1.0, hue: 300, alpha: 0.065 },
          { ox: 0.12, oy: 0.34, r: 16, depth: 1.25, hue: 175, alpha: 0.055 },
        ];

        // Soft multi-hue nebula washes — spaced so deep black voids remain
        // Bottom-left gold/yellow-green muddy fog removed per request
        const nebulaClouds = [
          { ox: -0.38, oy: -0.22, r: 0.42, rgba: 'rgba(85, 135, 255, 0.195)', mid: 'rgba(50, 95, 220, 0.075)' },
          { ox: 0.36, oy: -0.28, r: 0.38, rgba: 'rgba(255, 70, 185, 0.185)', mid: 'rgba(200, 40, 130, 0.068)' },
          { ox: 0.42, oy: 0.3, r: 0.36, rgba: 'rgba(35, 230, 210, 0.185)', mid: 'rgba(25, 175, 160, 0.068)' },
          { ox: 0.08, oy: 0.02, r: 0.28, rgba: 'rgba(140, 95, 255, 0.145)', mid: 'rgba(95, 60, 210, 0.05)' },
          { ox: -0.55, oy: 0.05, r: 0.3, rgba: 'rgba(245, 80, 130, 0.14)', mid: 'rgba(185, 45, 90, 0.05)' },
        ];

        // Multi-hue star accent palette (RGB strings for halo) — punchier chroma
        const starHues = [
          '120,170,255', // vivid blue
          '205,120,255', // vivid violet
          '255,185,90',  // vivid gold
          '80,235,210',  // vivid teal
          '255,115,165', // vivid magenta-pink
        ];

        const sparks = [];
        const shockwaves = [];
        const suns = [];
        let seeded = false;
        let start = performance.now();

        function seedStars() {
          for (const layer of layers) {
            layer.stars.length = 0;
            for (let i = 0; i < layer.count; i += 1) {
              const x = Math.random() * width;
              const y = Math.random() * height;
              layer.stars.push({
                hx: x,
                hy: y,
                x,
                y,
                vx: 0,
                vy: 0,
                r: layer.sizeMin + Math.random() * (layer.sizeMax - layer.sizeMin),
                a: Math.random() * 0.55 + 0.3,
                twinkle: Math.random() * 0.025 + 0.004,
                phase: Math.random() * Math.PI * 2,
                hueIdx: Math.floor(Math.random() * starHues.length),
              });
            }
          }
          seeded = true;
        }

        function resize() {
          width = window.innerWidth;
          height = window.innerHeight;
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.floor(width * dpr);
          canvas.height = Math.floor(height * dpr);
          canvas.style.width = width + 'px';
          canvas.style.height = height + 'px';
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          if (!seeded || layers[0].stars.length === 0) seedStars();
          if (!mouse.active) {
            mouse.tpx = width * 0.5;
            mouse.tpy = height * 0.5;
            mouse.px = mouse.tpx;
            mouse.py = mouse.tpy;
          }
        }

        function burst(x, y, magnitude = 1) {
          if (reducedMotion) return;
          // Moderate fireworks: larger than medium (14–30), clearly under Rosette (90–160+)
          const particles = Math.floor((32 + Math.random() * 30) * magnitude);
          // Cosmic palette: blue / magenta / gold / teal — saturated, not rainbow chaos
          const palette = [210, 320, 45, 175, 280];
          const baseHue = palette[Math.floor(Math.random() * palette.length)];
          for (let i = 0; i < particles; i += 1) {
            const speed = (Math.random() * 3.8 + 0.7) * magnitude;
            const angle = Math.random() * Math.PI * 2;
            sparks.push({
              x,
              y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              life: 0,
              maxLife: Math.random() * 70 + 48,
              size: Math.random() * 2.6 + 0.7,
              hue: (baseHue + Math.random() * 28 - 14 + 360) % 360,
            });
          }
        }

        function birthSun(x, y) {
          if (reducedMotion) return;
          const span = Math.max(width, height);
          suns.push({
            x,
            y,
            life: 0,
            // Birth (~1.2s) → linger (~8s) → fade (~3s)
            birthLife: 72,
            settleLife: 480,
            maxLife: 660,
            coreR: Math.min(28, span * 0.028),
            coronaR: Math.min(140, span * 0.12),
            rayCount: 14 + Math.floor(Math.random() * 6),
            rayPhase: Math.random() * Math.PI * 2,
            spin: 0.004 + Math.random() * 0.003,
          });

          // Soft gold birth pulse (corona fold-in) — smaller than prior fireworks shockwaves
          shockwaves.push(
            { x, y, r: 0, maxR: span * 0.28, life: 0, maxLife: 54, width: 2.2, hue: 42, alpha: 0.42 },
            { x, y, r: 4, maxR: span * 0.16, life: 0, maxLife: 40, width: 1.4, hue: 28, alpha: 0.28 }
          );

          // Gentle outward nudge from the birth
          for (const layer of layers) {
            const impulse = 0.85 * layer.depth;
            for (const star of layer.stars) {
              const dx = star.x - x;
              const dy = star.y - y;
              const dist = Math.sqrt(dx * dx + dy * dy) || 1;
              if (dist < span * 0.4) {
                const falloff = 1 - dist / (span * 0.4);
                const force = impulse * falloff * falloff;
                star.vx += (dx / dist) * force;
                star.vy += (dy / dist) * force;
              }
            }
          }

          // Smaller fireworks folded into the birth (gold-biased sparks)
          const particles = 18 + Math.floor(Math.random() * 14);
          for (let i = 0; i < particles; i += 1) {
            const speed = Math.random() * 2.2 + 0.5;
            const angle = Math.random() * Math.PI * 2;
            sparks.push({
              x,
              y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              life: 0,
              maxLife: Math.random() * 50 + 36,
              size: Math.random() * 2.0 + 0.5,
              hue: (38 + Math.random() * 28 - 8 + 360) % 360,
            });
          }
        }

        function updateAndDrawSuns() {
          for (let i = suns.length - 1; i >= 0; i -= 1) {
            const s = suns[i];
            s.life += 1;
            const life = s.life;

            // Scale & alpha envelope: expand → settle → fade
            let scale;
            let alpha;
            if (life < s.birthLife) {
              const t = life / s.birthLife;
              // Ease-out expansion
              scale = 0.15 + 0.85 * (1 - Math.pow(1 - t, 3));
              alpha = 0.55 + 0.45 * t;
            } else if (life < s.settleLife) {
              const t = (life - s.birthLife) / (s.settleLife - s.birthLife);
              // Soft pulse while lingering
              scale = 0.92 + 0.08 * Math.sin(t * Math.PI * 4);
              alpha = 0.88 + 0.08 * Math.sin(t * Math.PI * 2);
            } else {
              const t = (life - s.settleLife) / (s.maxLife - s.settleLife);
              scale = 0.92 * (1 - t * 0.35);
              alpha = Math.max(0, 0.9 * (1 - t) * (1 - t));
            }

            const core = s.coreR * scale;
            const corona = s.coronaR * scale;
            const rayLen = corona * 1.55;
            const rot = s.rayPhase + life * s.spin;

            // Outer warm corona wash
            const outer = ctx.createRadialGradient(s.x, s.y, core * 0.4, s.x, s.y, corona);
            outer.addColorStop(0, `rgba(255, 230, 160, ${0.55 * alpha})`);
            outer.addColorStop(0.35, `rgba(255, 180, 60, ${0.28 * alpha})`);
            outer.addColorStop(0.7, `rgba(255, 120, 30, ${0.1 * alpha})`);
            outer.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = outer;
            ctx.beginPath();
            ctx.arc(s.x, s.y, corona, 0, Math.PI * 2);
            ctx.fill();

            // Soft rays
            ctx.save();
            ctx.translate(s.x, s.y);
            ctx.rotate(rot);
            for (let r = 0; r < s.rayCount; r += 1) {
              const a = (r / s.rayCount) * Math.PI * 2;
              const len = rayLen * (0.7 + 0.3 * Math.sin(life * 0.05 + r));
              const half = 0.045 + (r % 3) * 0.012;
              ctx.beginPath();
              ctx.moveTo(Math.cos(a - half) * core * 0.6, Math.sin(a - half) * core * 0.6);
              ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len);
              ctx.lineTo(Math.cos(a + half) * core * 0.6, Math.sin(a + half) * core * 0.6);
              ctx.closePath();
              const rayGrad = ctx.createLinearGradient(0, 0, Math.cos(a) * len, Math.sin(a) * len);
              rayGrad.addColorStop(0, `rgba(255, 245, 200, ${0.55 * alpha})`);
              rayGrad.addColorStop(0.45, `rgba(255, 200, 90, ${0.22 * alpha})`);
              rayGrad.addColorStop(1, 'rgba(255, 160, 40, 0)');
              ctx.fillStyle = rayGrad;
              ctx.fill();
            }
            ctx.restore();

            // Bright warm core
            const coreG = ctx.createRadialGradient(s.x - core * 0.15, s.y - core * 0.15, 0, s.x, s.y, core);
            coreG.addColorStop(0, `rgba(255, 255, 250, ${0.98 * alpha})`);
            coreG.addColorStop(0.35, `rgba(255, 240, 180, ${0.95 * alpha})`);
            coreG.addColorStop(0.7, `rgba(255, 190, 70, ${0.7 * alpha})`);
            coreG.addColorStop(1, `rgba(255, 140, 30, 0)`);
            ctx.beginPath();
            ctx.fillStyle = coreG;
            ctx.arc(s.x, s.y, core, 0, Math.PI * 2);
            ctx.fill();

            // Tiny white hotspot
            ctx.beginPath();
            ctx.fillStyle = `rgba(255, 255, 255, ${0.95 * alpha})`;
            ctx.arc(s.x - core * 0.12, s.y - core * 0.12, core * 0.28, 0, Math.PI * 2);
            ctx.fill();

            if (life >= s.maxLife) suns.splice(i, 1);
          }
        }

        function drawNebula(ox, oy) {
          const cx = width * 0.5 + ox * 0.28;
          const cy = height * 0.5 + oy * 0.28;
          // Pure deep space base — voids stay black
          ctx.fillStyle = '#000000';
          ctx.fillRect(0, 0, width, height);

          // Very soft central depth veil (keeps logo area from going flat)
          const veil = ctx.createRadialGradient(
            cx,
            cy,
            30,
            cx,
            cy,
            Math.max(width, height) * 0.7
          );
          veil.addColorStop(0, 'rgba(6, 8, 22, 0.35)');
          veil.addColorStop(0.45, 'rgba(2, 3, 10, 0.18)');
          veil.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = veil;
          ctx.fillRect(0, 0, width, height);

          // Large translucent color clouds — cosmic, not microscopic
          const span = Math.max(width, height);
          for (const cloud of nebulaClouds) {
            const x = cx + cloud.ox * width;
            const y = cy + cloud.oy * height;
            const radius = span * cloud.r;
            const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
            g.addColorStop(0, cloud.rgba);
            g.addColorStop(0.45, cloud.mid);
            g.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, width, height);
          }
        }

        function drawPlanets(px, py) {
          const cx = width * 0.5;
          const cy = height * 0.5;
          for (const p of planets) {
            const x = cx + p.ox * Math.min(width, height) + px * p.depth * 36;
            const y = cy + p.oy * Math.min(width, height) + py * p.depth * 28;
            const g = ctx.createRadialGradient(x - p.r * 0.3, y - p.r * 0.3, 0, x, y, p.r);
            g.addColorStop(0, `hsla(${p.hue}, 58%, 62%, ${p.alpha * 1.35})`);
            g.addColorStop(0.55, `hsla(${p.hue}, 48%, 40%, ${p.alpha * 0.8})`);
            g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.beginPath();
            ctx.fillStyle = g;
            ctx.arc(x, y, p.r, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        function updateAndDrawStars(px, py, t) {
          // Midway gravity radius (wild 0.42 / calm 0.32)
          const softRadius = Math.max(width, height) * 0.37;
          const softRadiusSq = softRadius * softRadius;

          for (const layer of layers) {
            const ox = px * layer.depth * 40;
            const oy = py * layer.depth * 32;

            for (const star of layer.stars) {
              if (!reducedMotion) {
                // Home spring (midway 0.01 between wild 0.008 and calm 0.012)
                const hx = star.hx - star.x;
                const hy = star.hy - star.y;
                star.vx += hx * 0.01;
                star.vy += hy * 0.01;

                // Gravity toward mouse (stronger for nearer layers)
                if (mouse.active) {
                  const dx = mouse.px - (star.x + ox);
                  const dy = mouse.py - (star.y + oy);
                  const distSq = dx * dx + dy * dy;
                  if (distSq < softRadiusSq && distSq > 4) {
                    const dist = Math.sqrt(distSq);
                    // Soft gravity: strongest mid-range, fades near cursor to avoid clumping
                    const near = Math.min(1, dist / 60);
                    const falloff = (1 - dist / softRadius);
                    const force = layer.pull * falloff * falloff * near;
                    star.vx += (dx / dist) * force;
                    star.vy += (dy / dist) * force;
                  }
                }

                star.vx *= 0.93;
                star.vy *= 0.93;
                star.x += star.vx;
                star.y += star.vy;

                star.a += Math.sin(t * 0.001 + star.phase) * star.twinkle * 0.15;
                star.a += (Math.random() - 0.5) * star.twinkle * 0.3;
                star.a = Math.min(1, Math.max(0.2, star.a));
              }

              let sx = star.x + ox;
              let sy = star.y + oy;
              if (sx < -4) sx += width + 8;
              if (sx > width + 4) sx -= width + 8;
              if (sy < -4) sy += height + 8;
              if (sy > height + 4) sy -= height + 8;

              // Multi-hue halo on nearer / brighter stars
              if (layer.depth > 0.55 && star.a > 0.42) {
                ctx.beginPath();
                ctx.fillStyle = `rgba(${starHues[star.hueIdx]},${star.a * 0.30})`;
                ctx.arc(sx, sy, star.r * 3.6, 0, Math.PI * 2);
                ctx.fill();
              }

              // Crisp white core (drawn after halo so core stays sharp)
              ctx.beginPath();
              ctx.fillStyle = `rgba(248,250,255,${star.a})`;
              ctx.arc(sx, sy, star.r, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }

        function updateSparks() {
          for (let i = sparks.length - 1; i >= 0; i -= 1) {
            const p = sparks[i];
            p.life += 1;
            p.x += p.vx;
            p.y += p.vy;
            p.vx *= 0.988;
            p.vy *= 0.988;
            p.vy += 0.003;
            const t = p.life / p.maxLife;
            const alpha = Math.max(0, 1 - t);
            ctx.beginPath();
            ctx.fillStyle = `hsla(${p.hue}, 90%, 78%, ${alpha * 0.95})`;
            ctx.shadowBlur = 18 * alpha;
            ctx.shadowColor = `hsla(${p.hue}, 92%, 72%, ${alpha * 0.8})`;
            ctx.arc(p.x, p.y, p.size * (1 - t * 0.5), 0, Math.PI * 2);
            ctx.fill();
            if (p.life >= p.maxLife) sparks.splice(i, 1);
          }
          ctx.shadowBlur = 0;
        }

        function updateShockwaves() {
          for (let i = shockwaves.length - 1; i >= 0; i -= 1) {
            const w = shockwaves[i];
            w.life += 1;
            const t = w.life / w.maxLife;
            w.r = w.maxR * (1 - Math.pow(1 - t, 2.2));
            const alpha = w.alpha * Math.max(0, 1 - t);
            ctx.beginPath();
            ctx.strokeStyle = `hsla(${w.hue}, 78%, 76%, ${alpha})`;
            ctx.lineWidth = w.width * (1 - t * 0.5);
            ctx.shadowBlur = 16 * alpha;
            ctx.shadowColor = `hsla(${w.hue}, 82%, 70%, ${alpha * 0.6})`;
            ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2);
            ctx.stroke();
            if (t < 0.35) {
              const bloom = ctx.createRadialGradient(w.x, w.y, 0, w.x, w.y, w.r * 0.35 + 8);
              bloom.addColorStop(0, `hsla(${w.hue}, 70%, 78%, ${alpha * 0.3})`);
              bloom.addColorStop(1, 'rgba(0,0,0,0)');
              ctx.fillStyle = bloom;
              ctx.beginPath();
              ctx.arc(w.x, w.y, w.r * 0.35 + 8, 0, Math.PI * 2);
              ctx.fill();
            }
            if (w.life >= w.maxLife) shockwaves.splice(i, 1);
          }
          ctx.shadowBlur = 0;
        }

        function frame(now) {
          const t = now - start;

          if (!reducedMotion) {
            idle.ax = Math.sin(t * 0.00018) * 0.18;
            idle.ay = Math.cos(t * 0.00014) * 0.12;
          } else {
            idle.ax = 0;
            idle.ay = 0;
          }

          const lerp = reducedMotion ? 1 : 0.06;
          mouse.x += (mouse.tx - mouse.x) * lerp;
          mouse.y += (mouse.ty - mouse.y) * lerp;
          mouse.px += (mouse.tpx - mouse.px) * (reducedMotion ? 1 : 0.12);
          mouse.py += (mouse.tpy - mouse.py) * (reducedMotion ? 1 : 0.12);

          const px = mouse.x + idle.ax;
          const py = mouse.y + idle.ay;

          ctx.clearRect(0, 0, width, height);
          drawNebula(px, py);
          drawPlanets(px, py);
          updateAndDrawStars(px, py, t);
          if (!reducedMotion) {
            updateAndDrawSuns();
            updateSparks();
            updateShockwaves();
          }

          requestAnimationFrame(frame);
        }

        function onPointer(e) {
          if (reducedMotion) return;
          mouse.active = true;
          const x = (e.clientX / width) * 2 - 1;
          const y = (e.clientY / height) * 2 - 1;
          mouse.tx = Math.max(-1, Math.min(1, x));
          mouse.ty = Math.max(-1, Math.min(1, y));
          mouse.tpx = e.clientX;
          mouse.tpy = e.clientY;
        }

        function onPointerLeave() {
          mouse.active = false;
        }

        function onClick(e) {
          if (reducedMotion) return;
          const x = e.clientX;
          const y = e.clientY;
          const cx = Number.isFinite(x) ? x : width * 0.5;
          const cy = Number.isFinite(y) ? y : height * 0.5;
          birthSun(cx, cy);
        }

        function scheduleRandomBursts() {
          if (reducedMotion) return;
          const delay = 2800 + Math.random() * 4200;
          setTimeout(() => {
            if (!reducedMotion) {
              burst(
                Math.random() * width,
                Math.random() * height,
                0.3 + Math.random() * 0.4
              );
              scheduleRandomBursts();
            }
          }, delay);
        }

        function onMotionChange(e) {
          reducedMotion = e.matches;
          if (reducedMotion) {
            sparks.length = 0;
            shockwaves.length = 0;
            suns.length = 0;
            for (const layer of layers) {
              for (const star of layer.stars) {
                star.x = star.hx;
                star.y = star.hy;
                star.vx = 0;
                star.vy = 0;
              }
            }
          }
        }

        window.addEventListener('resize', resize);
        window.addEventListener('pointermove', onPointer, { passive: true });
        window.addEventListener('pointerleave', onPointerLeave, { passive: true });
        window.addEventListener('pointerdown', onClick, { passive: true });
        if (motionQuery.addEventListener) {
          motionQuery.addEventListener('change', onMotionChange);
        } else if (motionQuery.addListener) {
          motionQuery.addListener(onMotionChange);
        }

        resize();
        if (!reducedMotion) {
          for (let i = 0; i < 2; i += 1) {
            burst(
              Math.random() * width,
              Math.random() * height,
              0.35 + Math.random() * 0.3
            );
          }
          scheduleRandomBursts();
        }
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
